name: Pitch Scout Daily Scraper

on:
  schedule:
    # Run 3x per day: 8am, 1pm, 6pm ET (12, 17, 22 UTC)
    - cron: '0 12 * * *'
    - cron: '0 17 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch: # Allow manual triggering from GitHub UI

concurrency:
  group: pitch-scout-scraper-main
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    env:
      PUPPETEER_SKIP_DOWNLOAD: true
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Run scraper with transient-error retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Scrape attempt ${attempt}/3"
            if node scraper/engine.js; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Commit and push changes
        run: |
          git config --global user.name 'pitchscout-bot'
          git config --global user.email 'bot@pitchscout.local'
          git add src/data/mockState.json
          git diff --staged --quiet || git commit -m "chore: auto-update field schedules [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
